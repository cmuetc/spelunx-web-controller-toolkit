<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, user-scalable=no"/>
  <title>Join Game</title>
  <link rel="stylesheet" href="join.css">
</head>
<body>
 
  <!-- JOIN SCREEN -->
  <div id="join">
 
    <!-- LOGO: inline SVG -->
    <svg class="logo" viewBox="0 0 260 80" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="260" height="80" rx="12" fill="#111"/>
      <!-- Chequered flag strip -->
      <rect x="0" y="0" width="260" height="80" rx="12" fill="none" stroke="#fff" stroke-width="2" opacity="0.15"/>
      <g opacity="0.12">
        <rect x="0"   y="0"  width="20" height="20" fill="#fff"/>
        <rect x="20"  y="20" width="20" height="20" fill="#fff"/>
        <rect x="240" y="0"  width="20" height="20" fill="#fff"/>
        <rect x="220" y="20" width="20" height="20" fill="#fff"/>
      </g>
      <!-- "270" number plate style -->
      <text x="130" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="28" fill="#ff4400" letter-spacing="4">270</text>
      <text x="130" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="15" fill="#ffffff" letter-spacing="6">RACING</text>
    </svg>
 
    <input id="code" type="text" placeholder="Room Code" maxlength="4"/>
    <input id="name" type="text" placeholder="Your Name" maxlength="16"/>
    <button id="joinBtn">Join Game</button>
    <p id="status"></p>
  </div>
 
  <!-- TEAM SELECT SCREEN -->
  <div id="teamSelect" class="hidden">
    <h2>Select Your Team</h2>
 
    <!-- Team Tempest (red) -->
    <button class="team-btn" data-team="red">
      <svg viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
        <rect width="280" height="80" rx="14" fill="#cc2200"/>
        <rect width="280" height="80" rx="14" fill="none" stroke="#ff6644" stroke-width="1.5" opacity="0.5"/>
        <!-- Lightning bolt -->
        <polygon points="110,14 90,44 108,44 88,68 130,34 112,34 132,14" fill="#ffdd00" opacity="0.95"/>
        <text x="152" y="34" font-family="system-ui,sans-serif" font-weight="900" font-size="20" fill="#fff" letter-spacing="2">TEMPEST</text>
        <text x="152" y="56" font-family="system-ui,sans-serif" font-weight="600" font-size="13" fill="#ffaa88" letter-spacing="3">TEAM RED</text>
      </svg>
    </button>
 
    <!-- Team Sonic (blue) -->
    <button class="team-btn" data-team="blue">
      <svg viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
        <rect width="280" height="80" rx="14" fill="#0044cc"/>
        <rect width="280" height="80" rx="14" fill="none" stroke="#4488ff" stroke-width="1.5" opacity="0.5"/>
        <!-- Sound wave arcs -->
        <path d="M80,40 Q90,24 100,40 Q110,56 120,40" fill="none" stroke="#66aaff" stroke-width="3" stroke-linecap="round"/>
        <path d="M70,40 Q88,16 106,40 Q124,64 142,40" fill="none" stroke="#4488ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <text x="158" y="34" font-family="system-ui,sans-serif" font-weight="900" font-size="20" fill="#fff" letter-spacing="2">SONIC</text>
        <text x="158" y="56" font-family="system-ui,sans-serif" font-weight="600" font-size="13" fill="#88bbff" letter-spacing="3">TEAM BLUE</text>
      </svg>
    </button>
 
    <!-- Team Phantom (green) -->
    <button class="team-btn" data-team="green">
      <svg viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
        <rect width="280" height="80" rx="14" fill="#006655"/>
        <rect width="280" height="80" rx="14" fill="none" stroke="#44ffcc" stroke-width="1.5" opacity="0.5"/>
        <!-- Ghost shape -->
        <path d="M90,62 L90,28 Q90,14 104,14 Q118,14 118,28 L118,62 Q114,56 111,62 Q108,56 104,62 Q100,56 97,62 Q94,56 90,62 Z" fill="#44ffcc" opacity="0.9"/>
        <circle cx="100" cy="32" r="3" fill="#006655"/>
        <circle cx="110" cy="32" r="3" fill="#006655"/>
        <text x="136" y="34" font-family="system-ui,sans-serif" font-weight="900" font-size="20" fill="#fff" letter-spacing="2">PHANTOM</text>
        <text x="136" y="56" font-family="system-ui,sans-serif" font-weight="600" font-size="13" fill="#88ffdd" letter-spacing="3">TEAM GREEN</text>
      </svg>
    </button>
 
    <p id="teamStatus"></p>
  </div>
 
  <script src="join.js"></script>
</body>
</html>
