<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, user-scalable=no"/>
  <title>Player 4 · Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #44ff99;
      --bg: #040f09;
      --panel: #081a0e;
      --border: rgba(68,255,153,0.2);
      --text: #e0f5eb;
    }
    *, *::before, *::after { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; overflow: hidden; }

    body {
      background-image:
        radial-gradient(ellipse 100% 50% at 50% 0%, rgba(68,255,153,0.07) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(68,255,153,0.04) 39px, rgba(68,255,153,0.04) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(68,255,153,0.04) 39px, rgba(68,255,153,0.04) 40px);
    }

    #pad {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding-top: 48px; gap: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #pad.active { opacity: 1; pointer-events: all; }

    .slot-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px; letter-spacing: 0.3em;
      color: var(--accent); opacity: 0.7;
    }

    .big-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(44px, 12vw, 68px);
      letter-spacing: 0.08em;
      color: var(--accent); line-height: 1;
      text-shadow: 0 0 40px rgba(68,255,153,0.4);
    }

    .subtitle {
      font-size: 11px; letter-spacing: 0.2em;
      color: rgba(255,255,255,0.25); text-transform: uppercase;
      margin-top: -16px;
    }

    /* FEED */
    #feed {
      width: min(380px, 92vw);
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 0 24px;
    }

    .feed-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      animation: slideIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
    }

    .feed-item.new {
      border-color: var(--accent);
      box-shadow: 0 0 16px rgba(68,255,153,0.2);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }

    .feed-from {
      font-size: 10px; letter-spacing: 0.2em;
      color: var(--accent); text-transform: uppercase;
      margin-bottom: 6px; opacity: 0.8;
    }

    .feed-text {
      font-size: 16px; letter-spacing: 0.02em;
      color: #fff; line-height: 1.4;
      word-break: break-word;
    }

    .feed-time {
      font-size: 10px; letter-spacing: 0.1em;
      color: rgba(255,255,255,0.2);
      margin-top: 8px;
    }

    /* Empty state */
    #empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%;
      gap: 12px; color: rgba(255,255,255,0.15);
    }
    #empty svg { opacity: 0.2; }
    #empty p { font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; margin: 0; }

    /* Blink dot */
    .live-dot {
      display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
      animation: blink 1.2s ease infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }

    #status { font-size: 12px; letter-spacing: 0.15em; color: rgba(255,255,255,0.3); text-transform: uppercase; padding-bottom: 16px; }

    #disconnected {
      position: absolute; inset: 0; background: rgba(0,0,0,0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 10; transition: opacity 0.3s;
    }
    #disconnected.hidden { opacity: 0; pointer-events: none; }
    #disconnected p { color: white; font-size: 20px; font-weight: 700; margin: 0; letter-spacing: 0.1em; }
    #disconnected button {
      padding: 12px 32px; font-size: 14px; border: none; border-radius: 10px;
      cursor: pointer; font-family: inherit; font-weight: 500; letter-spacing: 0.08em;
    }
    #reconnectBtn { background: var(--accent); color: #000; }
    #backBtn { background: #1a1a1a; color: #666; margin-top: 4px; }
  </style>
</head>
<body>

<div id="pad">
  <div class="slot-badge">Player 4 · Slot 04</div>
  <div class="big-label">DISPLAY</div>
  <div class="subtitle"><span class="live-dot"></span>Incoming transmissions</div>

  <div id="feed">
    <div id="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>Waiting for messages</p>
    </div>
  </div>

  <div id="status">Connecting…</div>
</div>

<div id="disconnected" class="hidden">
  <p>Disconnected</p>
  <button id="reconnectBtn">Reconnect</button>
  <button id="backBtn">Back</button>
</div>


<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
const code         = (qs("code")||"").toUpperCase();
const name         = qs("name")||"Player";
const slotFromUrl  = parseInt(qs("slot")||"0");  // hint passed by join.html
if (!code) location.href = "join.html";

const slotPages = {
  1: "controller_p1.html",
  2: "controller_p2.html",
  3: "controller_p3.html",
  4: "controller_p4.html"
};

// Show expected slot immediately from URL hint (no flicker waiting for WS)
if (slotFromUrl) {
  const badge = document.querySelector(".slot-badge");
  if (badge) badge.textContent = `Player ${slotFromUrl} · Slot 0${slotFromUrl}`;
}

let ws = null;

const statusEl = document.getElementById("status");
const feed     = document.getElementById("feed");
const empty    = document.getElementById("empty");
function send(o){ if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(o)); }
function escHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function addMessage(text, from) {
  if (empty.parentNode === feed) feed.removeChild(empty);
  const now = new Date();
  const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const item = document.createElement("div");
  item.className = "feed-item new";
  item.innerHTML = `<div class="feed-from">${escHtml(from||"Unknown")}</div><div class="feed-text">${escHtml(text)}</div><div class="feed-time">${timeStr}</div>`;
  feed.insertBefore(item, feed.firstChild);
  setTimeout(() => item.classList.remove("new"), 2000);
  const items = feed.querySelectorAll(".feed-item");
  if (items.length > 20) items[items.length-1].remove();
  if (navigator.vibrate) navigator.vibrate([30,20,30]);
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?role=client&code=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`);
  statusEl.textContent = "Connecting…";

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.t === "joined") {
      // If server assigned a different slot than expected, redirect to correct page
      if (slotFromUrl && msg.slot !== slotFromUrl) {
        const page = slotPages[msg.slot] || slotPages[1];
        const p = new URLSearchParams({ code, name, slot: msg.slot });
        location.href = page + "?" + p;
        return;
      }
      const badge = document.querySelector(".slot-badge");
      if (badge) badge.textContent = `Player ${msg.slot} · Slot 0${msg.slot}`;
      statusEl.textContent = `Slot ${msg.slot} · ${name}`;
      document.getElementById("pad").classList.add("active");
      heartbeat();
    }
    
    if (msg.t === "incoming_text") { addMessage(msg.text, msg.from||"Player 2"); }
    if (msg.t === "host_broadcast" && msg.payload?.text) { addMessage(msg.payload.text, msg.payload.from||"Host"); }

  };

  ws.onclose = () => {
    statusEl.textContent = "Disconnected";
    document.getElementById("pad").classList.remove("active");
    document.getElementById("disconnected").classList.remove("hidden");
  };
}

function heartbeat() {
  if (ws?.readyState === WebSocket.OPEN) { send({ t: "ping" }); setTimeout(heartbeat, 10000); }
}

document.getElementById("reconnectBtn").onclick = () => {
  document.getElementById("disconnected").classList.add("hidden"); connect();
};
document.getElementById("backBtn").onclick = () => location.href = "join.html";

connect();
</script>
</body>
</html>
