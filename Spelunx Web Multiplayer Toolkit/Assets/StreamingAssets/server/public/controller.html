<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, user-scalable=no"/>
  <title>Controller</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="controller.css">
</head>
<body>

  <!-- CONTROLLER -->
  <div id="pad">

    <!-- CONTROLS ROW: dpad + jump -->
    <div id="controls-row">

      <!-- D-PAD -->
      <div id="dpad">
        <div class="dpad-zone" id="dpad-up"    data-dir="up">
          <svg class="dpad-arrow" viewBox="0 0 24 24"><path d="M12 4l-8 10h16z"/></svg>
        </div>
        <div class="dpad-zone" id="dpad-down"  data-dir="down">
          <svg class="dpad-arrow" viewBox="0 0 24 24"><path d="M12 20l8-10H4z"/></svg>
        </div>
        <div class="dpad-zone" id="dpad-left"  data-dir="left">
          <svg class="dpad-arrow" viewBox="0 0 24 24"><path d="M4 12l10-8v16z"/></svg>
        </div>
        <div class="dpad-zone" id="dpad-right" data-dir="right">
          <svg class="dpad-arrow" viewBox="0 0 24 24"><path d="M20 12L10 4v16z"/></svg>
        </div>
        <div id="dpad-lines"></div>
        <div id="dpad-center"></div>
      </div>

      <!-- JUMP BUTTON -->
      <button id="jumpBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" width="32" height="32">
          <polyline points="5 15 12 8 19 15"/>
        </svg>
        <span>JUMP</span>
      </button>

    </div><!-- end controls-row -->

    <p id="pad-status"></p>
  </div>

  <!-- Disconnected overlay -->
  <div id="disconnected" class="hidden">
    <p>Disconnected</p>
    <button id="reconnectBtn">Reconnect</button>
    <button id="backBtn">Back to Join</button>
  </div>

  <script src="controller.js"></script>
</body>
</html>
